<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Offline — Touch Dine</title>
        <meta name="theme-color" content="#EC3013">
        <meta name="robots" content="noindex">
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                background: #f6f6f7;
                color: #111827;
            }
            .card {
                width: 100%;
                max-width: 380px;
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 14px;
                padding: 28px 24px;
                text-align: center;
                box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
            }
            .mark {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 48px;
                width: 48px;
                border-radius: 12px;
                background: #ec3013;
            }
            h1 { font-size: 17px; font-weight: 700; margin: 16px 0 6px; }
            p { font-size: 13px; line-height: 1.55; color: #6b7280; margin: 0 0 20px; }
            button {
                font: inherit;
                font-size: 13px;
                font-weight: 600;
                color: #ffffff;
                background: #ec3013;
                border: 0;
                border-radius: 9px;
                padding: 10px 18px;
                cursor: pointer;
            }
            button:hover { background: #d42a10; }
            button:focus-visible { outline: 2px solid #111827; outline-offset: 2px; }
            .hint { margin: 14px 0 0; font-size: 11px; color: #9ca3af; }
        </style>
    </head>
    <body>
        <main class="card">
            <span class="mark" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 26 26">
                    <rect x="0" y="0" width="11" height="11" rx="2" fill="#F5F5F5" />
                    <rect x="15" y="0" width="11" height="11" rx="2" fill="#1A1A1A" />
                    <rect x="0" y="15" width="11" height="11" rx="2" fill="#F5F5F5" />
                    <rect x="15" y="15" width="11" height="11" rx="2" fill="#F5F5F5" />
                </svg>
            </span>

            <h1>You are offline</h1>
            <p>
                Touch Dine can&rsquo;t reach the server right now. Check your connection and
                try again.
            </p>

            <button type="button" onclick="window.location.reload()">Try again</button>

            <p class="hint">Pages you already have open keep working. Opening a new screen needs a connection.</p>
        </main>
    </body>
</html>
